<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADB Admin</title>
<!-- Requested directly: no favicon at all before — hard to recognize
     among other bookmarked tabs. Distinct from the main app's own icon
     (a photo of trucks, too detailed to read at favicon size) — a
     simple gear shape, on a dark background, legible even at 16px. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.png" type="image/png">
<style>
  *{box-sizing:border-box;}
  :root{
    --bg:#0A0A0B; --surface:#161516; --surface-2:#1F1D1E; --line:#2A2828;
    --ink:#F3F1EE; --ink-faint:#8C8985; --accent:#E8542B; --accent-soft:#3A241C;
    --live:#3CB878; --offline:#C0392B;
  }
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .header-icon{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none;background:#000;}
  .header-icon img{width:100%;height:100%;object-fit:cover;display:block;}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .subtitle{font-size:12.5px;color:var(--ink-faint);margin:2px 0 20px;padding-left:44px;}
  .stat-strip{display:flex;gap:10px;margin-bottom:18px;}
  .stat-box{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .stat-num{font-size:22px;font-weight:800;line-height:1;}
  .stat-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:5px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;}
  input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;
    margin-bottom:12px;font-family:inherit;background:var(--surface-2);color:var(--ink);
  }
  input::placeholder{color:var(--ink-faint);}
  button{
    appearance:none;border:none;border-radius:10px;padding:12px 18px;font-size:14.5px;font-weight:700;
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;
  }
  button:active{opacity:.8;}
  .btn-block{width:100%;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;font-weight:600;}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;}
  .toolbar button{flex:1;}
  .section-title{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .person-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .person-row{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;}
  .live-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--offline);}
  .live-dot.is-live{background:var(--live);box-shadow:0 0 0 0 rgba(60,184,120,.5);animation:pulse 1.6s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(60,184,120,.55);}
    70%{box-shadow:0 0 0 7px rgba(60,184,120,0);}
    100%{box-shadow:0 0 0 0 rgba(60,184,120,0);}
  }
  .person-main{flex:1;min-width:0;}
  .person-name{font-weight:800;font-size:15px;}
  .person-email{font-size:12px;color:var(--ink-faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .person-lastseen{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;flex:none;}
  .chevron{color:var(--ink-faint);flex:none;transition:transform .15s ease;font-size:13px;}
  .person-card.open .chevron{transform:rotate(90deg);}
  .person-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
  .person-card.open .person-detail{display:block;padding-top:14px;}
  .detail-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{color:var(--ink-faint);}
  .detail-value{font-weight:700;}
  .sheet-item{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12.5px;}
  .sheet-item-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px;}
  .sheet-item-meta{color:var(--ink-faint);display:flex;gap:12px;}
  .badge{
    display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:100px;
    background:var(--accent-soft);color:var(--accent);margin-top:6px;
  }
  .badge-hidden{background:var(--surface-2);color:var(--ink-faint);}
  .person-card.is-hidden{opacity:.5;}
  .device-list{font-size:10.5px;color:var(--ink-faint);font-family:monospace;margin-top:10px;line-height:1.7;}
  .device-list-title{font-size:11px;font-weight:700;color:var(--ink-faint);margin-top:14px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .device-list-detail{display:flex;flex-direction:column;gap:6px;}
  .device-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;}
  .device-row-info{font-size:12.5px;color:var(--ink);line-height:1.5;}
  .device-row-time{font-size:11px;color:var(--ink-faint);}
  .device-delete-btn{flex-shrink:0;padding:4px 9px;font-size:13px;}
  .detail-actions{display:flex;gap:8px;margin-top:14px;}
  .error{color:#E57373;font-size:13px;margin-top:-4px;margin-bottom:12px;}
  .empty{text-align:center;color:var(--ink-faint);padding:36px 0;font-size:14px;}
  #login-screen, #data-screen{display:none;}
  #login-screen.show, #data-screen.show{display:block;}
</style>
<script src="../vendor/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-icon"><img src="../icon-192.png" alt=""></div>
    <h1>ADB Smart — Autisti</h1>
  </div>
  <div class="subtitle" id="last-refreshed"></div>
  <div class="subtitle" id="live-diagnostic" style="font-size:11px;color:var(--ink-faint);"></div>

  <div id="login-screen" class="card show">
    <div id="login-error" class="error" style="display:none;">Password errata.</div>
    <button id="faceid-unlock-btn" class="btn-block" style="display:none;margin-bottom:12px;background:var(--accent);">🔓 Sblocca con Face ID</button>
    <input id="password-input" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" class="btn-block">Accedi</button>
  </div>

  <div id="data-screen">
    <div class="stat-strip">
      <div class="stat-box"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Autisti registrati</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-live">—</div><div class="stat-label">Live ora</div></div>
    </div>
    <div class="toolbar">
      <button id="refresh-btn" class="btn-ghost">↻ Aggiorna</button>
      <button id="toggle-hidden-btn" class="btn-ghost">Mostra nascosti</button>
    </div>
    <div id="drivers-list"></div>
  </div>
</div>

<script>
  var FUNCTION_URL = 'https://chboalgzigdglygnnist.supabase.co/functions/v1/admin-data';
  var SUPABASE_URL = 'https://chboalgzigdglygnnist.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoYm9hbGd6aWdkZ2x5Z25uaXN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTc4MjMsImV4cCI6MjEwMjEzMzgyM30.vorEiww3SvVAadgnAqFH42M-MjbpXOojAlhNm-cIeMI';
  var supabaseClient = (typeof supabase !== 'undefined' && supabase.createClient)
    ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;
  var currentPassword = '';
  var showHidden = false;
  var lastGroups = [];
  var openGroupKeys = {};
  var refreshTimer = null;

  // Real "who's online right now" — the SAME shared presence channel every
  // driver's phone joins while the app is open (see startPresence() in
  // app.js). This is genuine WebSocket presence, not a timestamp someone
  // has to interpret as "recent enough" — the moment a phone's connection
  // drops, Supabase removes it from this list automatically, and this
  // page re-renders instantly, live, with no polling at all.
  var liveEmails = {}; // account_email (lowercased) -> true, currently present
  var presenceReady = false;
  function startAdminPresenceWatch() {
    if (!supabaseClient) { setLiveDiagnostic('Client Supabase nu s-a incarcat'); return; }
    setLiveDiagnostic('Conectare...');
    var channel = supabaseClient.channel('drivers-presence');
    channel.on('presence', { event: 'sync' }, function () {
      var state = channel.presenceState();
      var next = {};
      var totalEntries = 0;
      Object.keys(state).forEach(function (key) {
        (state[key] || []).forEach(function (entry) {
          totalEntries++;
          if (entry.account_email) next[entry.account_email.toLowerCase()] = true;
        });
      });
      liveEmails = next;
      presenceReady = true;
      setLiveDiagnostic('Conectat — ' + totalEntries + ' prezenta/e primita/e');
      if (lastGroups.length) renderDrivers(lastGroupsRaw);
    });
    channel.subscribe(function (status, err) {
      if (status === 'SUBSCRIBED') setLiveDiagnostic('Conectat, in asteptarea semnalelor...');
      else if (status === 'CHANNEL_ERROR') setLiveDiagnostic('Eroare de conexiune: ' + (err ? err.message : 'necunoscuta'));
      else if (status === 'TIMED_OUT') setLiveDiagnostic('Conexiune expirata (timeout)');
      else if (status === 'CLOSED') setLiveDiagnostic('Conexiune inchisa');
    });
  }
  function setLiveDiagnostic(text) {
    var el = document.getElementById('live-diagnostic');
    if (el) el.textContent = 'Live: ' + text;
  }

  function showScreen(id) {
    document.getElementById('login-screen').classList.toggle('show', id === 'login-screen');
    document.getElementById('data-screen').classList.toggle('show', id === 'data-screen');
  }

  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  }
  function formatRelative(iso) {
    if (!iso) return 'mai visto';
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'proprio ora';
    if (mins < 60) return mins + ' min fa';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' h fa';
    var days = Math.round(hrs / 24);
    return days + ' g fa';
  }

  var MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  // Groups raw per-device rows into one entry per real person, matched by
  // normalized name+targa — the closest thing to a reliable identity for
  // drivers who haven't registered with email, and a safety net even for
  // those who have (covers the phone that hasn't synced its email yet).
  function groupDrivers(drivers) {
    var groups = {};
    (drivers || []).forEach(function (d) {
      // Prefer the confirmed email as the identifying key — it's the one
      // truly stable signal for a real person (only the actual account
      // owner could have confirmed it, and it survives a targa/vehicle
      // change over time, unlike grouping by name+targa alone). Only
      // fall back to name+targa for drivers who haven't registered an
      // email yet, since that's the best signal available for them.
      var key = d.account_email
        ? 'email:' + d.account_email.trim().toLowerCase()
        : 'nt:' + (d.nome || '').trim().toLowerCase() + '|' + (d.targa || '').trim().toLowerCase();
      if (!groups[key]) {
        groups[key] = {
          key: key, nome: d.nome || '(senza nome)', targa: d.targa || '—',
          _latestForNameTarga: null, _latestWithRealActivity: null, _fallbackNome: null, _hasOfficialName: false,
          emails: {}, deviceIds: [], devices: [], hidden: true, lastActive: null, lastHeartbeat: null,
          sheetsByKey: {}, activeMonth: null, activeYear: null, dailyRate: null
        };
      }
      var g = groups[key];
      // Which device's targa to show: prefer the most recent device that
      // has ACTUALLY created a sheet (real usage — active_month set),
      // over one that merely typed something into the field once and
      // never used the app. Falls back to "most recently touched" only
      // if nobody under this email has real activity yet.
      var hasRealActivity = !!(d.active_month && d.active_year);
      if (hasRealActivity && d.last_active && (!g._latestWithRealActivity || d.last_active > g._latestWithRealActivity)) {
        g.targa = d.targa || g.targa; g._fallbackNome = d.nome || g._fallbackNome;
        g._latestWithRealActivity = d.last_active;
      } else if (!g._latestWithRealActivity && d.last_active && (!g._latestForNameTarga || d.last_active > g._latestForNameTarga)) {
        g.targa = d.targa || g.targa; g._fallbackNome = d.nome || g._fallbackNome;
        g._latestForNameTarga = d.last_active;
      }
      // The name itself always prefers the OFFICIAL, current one from the
      // confirmed account (kept fresh server-side, updated every time a
      // magic link is sent) over anything typed locally into a device —
      // that field can't be spoofed or left stale the way a local device
      // field can. Only falls back to the activity-based device name
      // above when no confirmed account name exists at all.
      if (d.official_first_name) g.nome = d.official_first_name;
      else if (!g._hasOfficialName) g.nome = g._fallbackNome || g.nome;
      if (d.official_first_name) g._hasOfficialName = true;
      g.deviceIds.push(d.device_id);
      g.devices.push({ device_id: d.device_id, nome: d.nome || '(senza nome)', targa: d.targa || '—', last_active: d.last_active });
      if (d.account_email) g.emails[d.account_email] = true;
      // Group is "hidden" only if EVERY device under it is hidden.
      if (!d.hidden) g.hidden = false;
      if (d.last_active && (!g.lastActive || d.last_active > g.lastActive)) g.lastActive = d.last_active;
      if (d.last_heartbeat && (!g.lastHeartbeat || d.last_heartbeat > g.lastHeartbeat)) g.lastHeartbeat = d.last_heartbeat;
      if (d.active_month && d.active_year) {
        if (!g.activeYear || d.active_year > g.activeYear || (d.active_year === g.activeYear && d.active_month > g.activeMonth)) {
          g.activeMonth = d.active_month; g.activeYear = d.active_year;
        }
      }
      (d.sheets || []).forEach(function (s) {
        // REAL BUG, found and confirmed directly: on iOS, the same
        // installed app can lose its stored device_id (a storage
        // eviction issue, believed tied to switching between the
        // installed PWA and Safari — a workaround used elsewhere in
        // this app for a separate GPS limitation) and silently start
        // syncing under a FRESH device_id — but it's still reporting
        // the exact same underlying local sheet, unchanged. Concretely
        // confirmed: 4 different device_ids in one single day, all
        // reporting the IDENTICAL sheet_id with identical values,
        // summed here into 4x the real total (10 giorni became 40).
        // Deduplicates by sheet_id across every device under this same
        // person BEFORE summing — a sheet_id already counted once for
        // this group is skipped entirely on any later device reporting
        // that exact same sheet_id again. Only genuinely DIFFERENT
        // sheet_ids (a real second sheet, e.g. from an actual
        // reinstall that split real data across two distinct local
        // sheet objects) still add together, same as before.
        if (s.sheet_id) {
          if (!g._seenSheetIds) g._seenSheetIds = {};
          if (g._seenSheetIds[s.sheet_id]) return; // already counted this exact sheet from another device — skip
          g._seenSheetIds[s.sheet_id] = true;
        }
        var sKey = s.month + '-' + s.year + '-' + s.client;
        if (!g.sheetsByKey[sKey]) {
          g.sheetsByKey[sKey] = { month: s.month, year: s.year, client: s.client, total_km: 0, giorni_count: 0 };
        }
        g.sheetsByKey[sKey].total_km += Number(s.total_km) || 0;
        g.sheetsByKey[sKey].giorni_count += Number(s.giorni_count) || 0;
        if (s.daily_rate != null) g.dailyRate = Number(s.daily_rate);
      });
    });
    return Object.keys(groups).map(function (k) {
      var g = groups[k];
      g.emailList = Object.keys(g.emails);
      g.sheets = Object.keys(g.sheetsByKey).map(function (sk) { return g.sheetsByKey[sk]; })
        .sort(function (a, b) { return (b.year - a.year) || (b.month - a.month); });
      g.isLive = g.emailList.some(function (e) { return !!liveEmails[e.toLowerCase()]; });
      g.lastSeen = g.lastHeartbeat && (!g.lastActive || g.lastHeartbeat > g.lastActive) ? g.lastHeartbeat : g.lastActive;
      return g;
    });
  }

  function sheetDetailHtml(s, dailyRate) {
    var monthLabel = MESI[s.month - 1] + ' ' + s.year;
    var earnings = dailyRate ? (s.giorni_count * dailyRate) : null;
    var html = '<div class="sheet-item">';
    html += '<div class="sheet-item-top"><span>' + s.client + '</span><span>' + monthLabel + '</span></div>';
    html += '<div class="sheet-item-meta">';
    html += '<span>' + Math.round(s.total_km) + ' km</span>';
    html += '<span>' + s.giorni_count + ' giri</span>';
    if (earnings !== null) html += '<span>~€' + earnings.toFixed(0) + '</span>';
    html += '</div></div>';
    return html;
  }

  function personCardHtml(g) {
    var isOpen = !!openGroupKeys[g.key];
    var html = '<div class="person-card' + (g.hidden ? ' is-hidden' : '') + (isOpen ? ' open' : '') + '" data-key="' + g.key + '">';
    html += '<div class="person-row" data-toggle-open="' + g.key + '">';
    html += '<div class="live-dot' + (g.isLive ? ' is-live' : '') + '"></div>';
    html += '<div class="person-main">';
    html += '<div class="person-name">' + g.nome + '</div>';
    if (g.emailList.length) html += '<div class="person-email">' + g.emailList.join(', ') + '</div>';
    html += '</div>';
    html += '<div class="person-lastseen">' + (g.isLive ? 'Live ora' : formatRelative(g.lastSeen)) + '</div>';
    html += '<div class="chevron">▶</div>';
    html += '</div>';

    html += '<div class="person-detail">';
    html += '<div class="detail-row"><span class="detail-label">Targa</span><span class="detail-value">' + g.targa + '</span></div>';
    html += '<div class="detail-row"><span class="detail-label">Ultima attività</span><span class="detail-value">' + formatDate(g.lastSeen) + '</span></div>';
    var monthLabel = (g.activeMonth && g.activeYear) ? (MESI[g.activeMonth - 1] + ' ' + g.activeYear) : '—';
    html += '<div class="detail-row"><span class="detail-label">Mese attivo</span><span class="detail-value">' + monthLabel + '</span></div>';
    if (g.dailyRate) html += '<div class="detail-row"><span class="detail-label">Compenso giornaliero</span><span class="detail-value">€' + g.dailyRate + '</span></div>';

    // Total earnings for the CURRENT active month specifically (matching
    // what the driver's own app shows on its Home screen) — summed
    // across every client that month, not an all-time total across
    // every month ever worked.
    if (g.dailyRate && g.activeMonth && g.activeYear) {
      var currentMonthSheets = g.sheets.filter(function (s) { return s.month === g.activeMonth && s.year === g.activeYear; });
      var currentMonthDays = currentMonthSheets.reduce(function (sum, s) { return sum + (Number(s.giorni_count) || 0); }, 0);
      var currentMonthEarnings = currentMonthDays * g.dailyRate;
      html += '<div class="detail-row"><span class="detail-label">Guadagno ' + MESI[g.activeMonth - 1] + '</span><span class="detail-value" style="color:#3CB878;">€' + currentMonthEarnings.toFixed(0) + '</span></div>';
    }

    if (g.sheets.length) {
      html += '<div style="margin-top:4px;">';
      g.sheets.forEach(function (s) { html += sheetDetailHtml(s, g.dailyRate); });
      html += '</div>';
    } else {
      html += '<div class="empty" style="padding:14px 0;font-size:12.5px;">Nessun foglio ancora sincronizzato.</div>';
    }

    if (!(g.activeMonth && g.activeYear) && !g.sheets.length) html += '<div class="badge">Solo aperto — nessun foglio creato</div>';
    if (g.hidden) html += '<div class="badge badge-hidden">Nascosto</div>';

    // Every individual device seen under this person, newest first, each
    // with its own delete button — lets ION recognize and remove stale
    // test/duplicate entries himself, one at a time, without ever
    // automatically deleting anything (a driver switching phones, or
    // simply correcting a typo in their name, must never be silently
    // affected).
    var devicesSorted = g.devices.slice().sort(function (a, b) { return (new Date(b.last_active || 0)) - (new Date(a.last_active || 0)); });
    html += '<div class="device-list-title">' + g.devices.length + ' dispositivo/i registrati:</div>';
    html += '<div class="device-list-detail">';
    devicesSorted.forEach(function (dev) {
      html += '<div class="device-row">';
      html += '<div class="device-row-info"><b>' + dev.nome + '</b> · ' + dev.targa + '<br><span class="device-row-time">' + formatDate(dev.last_active) + '</span></div>';
      html += '<button class="btn-ghost btn-sm device-delete-btn" data-delete-device="' + dev.device_id + '" data-group-key="' + g.key + '">🗑</button>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="detail-actions">';
    html += '<button class="btn-ghost btn-sm" data-toggle-hidden="' + g.key + '" data-hidden="' + (g.hidden ? '1' : '0') + '">' + (g.hidden ? 'Mostra' : 'Nascondi') + '</button>';
    html += '</div>';
    html += '</div></div>';
    return html;
  }

  function renderDrivers(drivers) {
    // Nobody can use the app without confirming their email now, so an
    // entry with no confirmed email at all is either stale (from before
    // that requirement existed) or mid-registration — not someone worth
    // showing here.
    var registeredOnly = (drivers || []).filter(function (d) { return !!d.account_email; });
    lastGroups = groupDrivers(registeredOnly);
    var el = document.getElementById('drivers-list');

    document.getElementById('stat-total').textContent = lastGroups.filter(function (g) { return !g.hidden; }).length;
    document.getElementById('stat-live').textContent = lastGroups.filter(function (g) { return g.isLive; }).length;

    if (!lastGroups.length) {
      el.innerHTML = '<div class="card empty">Nessun autista si è ancora registrato.</div>';
      return;
    }
    var visible = lastGroups.filter(function (g) { return showHidden || !g.hidden; });
    if (!visible.length) {
      el.innerHTML = '<div class="card empty">Nessuno da mostrare — prova "Mostra nascosti".</div>';
      return;
    }
    visible.sort(function (a, b) {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      return (new Date(b.lastSeen || 0)) - (new Date(a.lastSeen || 0));
    });
    var active = visible.filter(function (g) { return g.activeMonth && g.activeYear; });
    var untried = visible.filter(function (g) { return !(g.activeMonth && g.activeYear); });
    var html = '';
    if (active.length) {
      html += '<div class="section-title">Autisti attivi (' + active.length + ')</div>';
      active.forEach(function (g) { html += personCardHtml(g); });
    }
    if (untried.length) {
      html += '<div class="section-title">Solo aperto, mai usato davvero (' + untried.length + ')</div>';
      untried.forEach(function (g) { html += personCardHtml(g); });
    }
    el.innerHTML = html;

    el.querySelectorAll('[data-toggle-open]').forEach(function (row) {
      row.addEventListener('click', function () {
        var key = row.getAttribute('data-toggle-open');
        openGroupKeys[key] = !openGroupKeys[key];
        var card = el.querySelector('.person-card[data-key="' + CSS.escape(key) + '"]');
        if (card) card.classList.toggle('open', openGroupKeys[key]);
      });
    });
    el.querySelectorAll('[data-toggle-hidden]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-toggle-hidden');
        var wasHidden = btn.getAttribute('data-hidden') === '1';
        var group = lastGroups.filter(function (g) { return g.key === key; })[0];
        if (group) toggleHiddenForGroup(group.deviceIds, !wasHidden);
      });
    });
    el.querySelectorAll('[data-delete-device]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var deviceId = btn.getAttribute('data-delete-device');
        if (!window.confirm('Eliminare definitivamente questo dispositivo? Non è possibile annullare.')) return;
        btn.disabled = true;
        fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: currentPassword, action: 'delete_device', device_id: deviceId })
        }).then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok) {
              fetchDrivers().then(function (res) { if (res.ok) { renderDrivers(res.data.drivers); setRefreshedNow(); } });
            } else {
              btn.disabled = false;
              window.alert('Eliminazione non riuscita — riprova.');
            }
          })
          .catch(function () { btn.disabled = false; window.alert('Eliminazione non riuscita — controlla la connessione.'); });
      });
    });
  }

  function setRefreshedNow() {
    document.getElementById('last-refreshed').textContent = 'Aggiornato alle ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  }

  function fetchDrivers() {
    return fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: currentPassword })
    }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
  }

  function toggleHiddenSingle(deviceId, hidden) {
    return fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: currentPassword, action: 'toggle_hidden', device_id: deviceId, hidden: hidden })
    });
  }
  function toggleHiddenForGroup(deviceIds, hidden) {
    Promise.all(deviceIds.map(function (id) { return toggleHiddenSingle(id, hidden); }))
      .then(function () { return fetchDrivers(); })
      .then(function (res) {
        if (res.ok) { lastGroupsRaw = res.data.drivers; renderDrivers(lastGroupsRaw); setRefreshedNow(); }
      });
  }

  document.getElementById('refresh-btn').addEventListener('click', function () {
    var btn = this;
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⟳ Aggiornamento...';
    fetchDrivers().then(function (res) {
      if (res.ok) {
        lastGroupsRaw = res.data.drivers;
        renderDrivers(lastGroupsRaw);
        setRefreshedNow();
        btn.textContent = '✓ Aggiornato';
      } else {
        btn.textContent = '✗ Errore — riprova';
      }
    }).catch(function () {
      btn.textContent = '✗ Errore — riprova';
    }).then(function () {
      setTimeout(function () { btn.disabled = false; btn.textContent = originalText; }, 1200);
    });
  });
  document.getElementById('toggle-hidden-btn').addEventListener('click', function () {
    showHidden = !showHidden;
    document.getElementById('toggle-hidden-btn').textContent = showHidden ? 'Nascondi i nascosti' : 'Mostra nascosti';
    renderDrivers(lastGroupsRaw);
  });

  var lastGroupsRaw = [];

  // Face ID / Touch ID unlock — a real WebAuthn platform-authenticator
  // credential, so the phone's own biometric sensor gates access,
  // instead of retyping the password every time. WebAuthn itself only
  // ever proves "this device/person was verified" — it doesn't carry
  // any data — so the actual password is kept locally (in this
  // browser's storage) and only released once that verification
  // succeeds. Worth being upfront about: this means the password IS
  // sitting in this browser's local storage either way — Face ID adds
  // real convenience and blocks casual glance-access, but isn't a
  // vault against someone with full access to the unlocked device
  // itself.
  var WEBAUTHN_CRED_KEY = 'fv_admin_webauthn_cred';
  var WEBAUTHN_PW_KEY = 'fv_admin_webauthn_pw';
  function webauthnSupported() { return !!(window.PublicKeyCredential && navigator.credentials); }
  function randomChallenge() { var a = new Uint8Array(32); crypto.getRandomValues(a); return a; }
  function bufToB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function b64ToBuf(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }

  function registerFaceId(password) {
    if (!webauthnSupported()) return Promise.reject(new Error('not supported'));
    var userId = new Uint8Array(16);
    crypto.getRandomValues(userId);
    return navigator.credentials.create({
      publicKey: {
        challenge: randomChallenge(),
        rp: { name: 'ADB Smart Admin' },
        user: { id: userId, name: 'admin', displayName: 'Admin' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    }).then(function (cred) {
      localStorage.setItem(WEBAUTHN_CRED_KEY, bufToB64(cred.rawId));
      localStorage.setItem(WEBAUTHN_PW_KEY, password);
    });
  }

  function unlockWithFaceId() {
    var credIdB64 = localStorage.getItem(WEBAUTHN_CRED_KEY);
    if (!credIdB64) return Promise.resolve(null);
    return navigator.credentials.get({
      publicKey: {
        challenge: randomChallenge(),
        allowCredentials: [{ id: b64ToBuf(credIdB64), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    }).then(function (assertion) {
      return assertion ? localStorage.getItem(WEBAUTHN_PW_KEY) : null;
    });
  }

  function offerFaceIdIfSensible() {
    if (localStorage.getItem(WEBAUTHN_CRED_KEY) || !webauthnSupported()) return;
    if (!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)) return;
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (available) {
      if (!available) return;
      if (window.confirm('Vuoi sbloccare con Face ID/Touch ID la prossima volta, invece di digitare la password?')) {
        registerFaceId(currentPassword).catch(function () { /* declined or failed — password login still works normally */ });
      }
    });
  }

  function login() {
    var pw = document.getElementById('password-input').value;
    var errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    currentPassword = pw;
    fetchDrivers()
      .then(function (res) {
        if (!res.ok) { errEl.style.display = 'block'; return; }
        sessionStorage.setItem('fv_admin_pw', pw);
        lastGroupsRaw = res.data.drivers;
        renderDrivers(lastGroupsRaw);
        setRefreshedNow();
        showScreen('data-screen');
        startAdminPresenceWatch();
        offerFaceIdIfSensible();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(function () {
          fetchDrivers().then(function (r) {
            if (r.ok) { lastGroupsRaw = r.data.drivers; renderDrivers(lastGroupsRaw); setRefreshedNow(); }
          });
        }, 30000);
      })
      .catch(function () { errEl.textContent = 'Errore di connessione.'; errEl.style.display = 'block'; });
  }

  if (localStorage.getItem(WEBAUTHN_CRED_KEY)) {
    document.getElementById('faceid-unlock-btn').style.display = 'block';
  }
  document.getElementById('faceid-unlock-btn').addEventListener('click', function () {
    unlockWithFaceId().then(function (pw) {
      if (pw) { document.getElementById('password-input').value = pw; login(); }
    }).catch(function () { /* cancelled or failed — person can still type the password normally */ });
  });

  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('password-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') login();
  });

  var savedPw = sessionStorage.getItem('fv_admin_pw');
  if (savedPw) {
    document.getElementById('password-input').value = savedPw;
    login();
  }
</script>
</body>
</html>
