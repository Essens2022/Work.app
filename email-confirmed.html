<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email confermata — ADB Smart</title>
<!-- Requested directly: investigating an indexing-issues notification
     in Search Console — this page ("crawled but not currently
     indexed") is a purely transactional confirmation screen shown
     after clicking an email-confirmation link, with no content of its
     own value for search results. Google had already, correctly,
     chosen not to index it — this makes that intentional and explicit
     instead, so it stops appearing as noise in future reports and
     Google doesn't spend crawl budget re-evaluating it. -->
<meta name="robots" content="noindex">
<!-- Facebook Pixel — requested directly, for the ad campaign landing
     on /official/. Only reached after a real, successful email
     confirmation, so CompleteRegistration is fired unconditionally
     here — the single most valuable signal for Facebook's ad
     optimization, since it marks someone who actually became a real
     user, not just a page visitor or a click. -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1687404222361241');
fbq('track', 'CompleteRegistration');
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1687404222361241&ev=CompleteRegistration&noscript=1"/></noscript>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0A0A0B;color:#F3F1EE;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding:24px;text-align:center;
  }
  .card{max-width:420px;width:100%;}
  .icon-wrap{width:34px;height:34px;border-radius:9px;overflow:hidden;margin:0 auto 20px;}
  .icon-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .check{
    width:76px;height:76px;border-radius:50%;background:#1C3A24;border:2px solid #3CB878;
    display:flex;align-items:center;justify-content:center;margin:0 auto 26px;
  }
  .check svg{width:38px;height:38px;}
  h1{font-size:26px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em;}
  h1 span{color:#3CB878;}
  p{font-size:15px;line-height:1.6;color:#B5B3AE;margin:0 0 6px;}
  .hint{font-size:13px;color:#8C8A85;margin-top:22px;}
  .brand{margin-top:34px;font-size:12px;font-weight:800;color:#E8542B;letter-spacing:.5px;}
  /* Requested directly: this page assumed the person could just switch
     back to the already-open installed app themselves — true on iOS
     (the link opens in a separate Safari tab), but NOT on Android,
     where the link replaces the app's own window in-place (no
     separate tab to leave, no way back at all before this). A real,
     working button now, not just passive text. */
  .btn-back{
    display:inline-block;margin-top:26px;padding:14px 28px;border-radius:100px;
    background:#E8542B;color:#fff;font-weight:800;font-size:15px;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><img src="icon-192.png" alt="ADB Smart"></div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3CB878" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12l6 6L20 6"/>
      </svg>
    </div>
    <h1>Email <span>confermata</span>!</h1>
    <p>Il tuo account ADB Smart è ora attivo.</p>
    <p>Tocca il pulsante qui sotto — troverai già tutto configurato, senza dover fare nient'altro.</p>
    <a href="./" class="btn-back">Torna all'app</a>
    <div class="hint">Se l'app era già aperta in un'altra scheda, puoi anche chiudere questa pagina.</div>
    <div class="brand">ADB SMART</div>
  </div>
</body>
</html>
